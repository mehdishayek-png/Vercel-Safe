[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
preDeployCommand = ["npm run db:migrate"]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
overlapSeconds = 30
drainingSeconds = 15
